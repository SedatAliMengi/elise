<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elise preview</title>
</head>
<body>
<div id="root"></div>
<script>
// Browser preview of Elise's UI with made-up sample data (no Tauri, no real
// calendar). Used by scripts/screenshots.mjs for the README images.
//   npm run dev   then open http://localhost:1420/scripts/preview.html
//   (?window=stage / ?window=overlay for the other windows)
(function () {
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const at = (dayOffset, h, m = 0) => { const d = new Date(today); d.setDate(d.getDate() + dayOffset); d.setHours(h, m, 0, 0); return d; };
  const ev = (id, title, start, mins, extra = {}) => ({
    event: { id, title, start: iso(start), end: mins ? iso(new Date(start.getTime() + mins * 60000)) : null, allDay: !mins,
      location: extra.location || null, notes: null, color: extra.color || null, recurrence: extra.rec || null, exdates: [],
      parentId: null, reminders: extra.reminders || [] },
    start: iso(start), end: iso(new Date(start.getTime() + (mins || 1440) * 60000)),
  });
  const OCC = [];
  OCC.push(ev("lunch", "Lunch with Ali", at(0, 13), 60, { color: "#22b8cf" }));
  OCC.push(ev("project", "Project meeting", at(1, 11), 60));
  OCC.push(ev("dentist", "Dentist", at(1, 15), 60, { color: "#d70000", reminders: [{ id: "r1", offsetMin: 1440, atTime: "20:00" }] }));
  OCC.push(ev("dinner", "Dinner with Sarah", at(2, 20), 90, { color: "#ff4f8b", location: "Kadıköy" }));
  for (let w = 0; w < 6; w++) OCC.push(ev("standup", "Team standup", at(4 + 7 * w - 7, 9), 15, { color: "#5b6cff", rec: { freq: "weekly", interval: 1 } }));
  for (let w = 0; w < 6; w++) OCC.push(ev("gym", "Gym", at(5 + 7 * w - 7, 18), 60, { color: "#f2a93b", rec: { freq: "weekly", interval: 1 } }));
  for (let w = 0; w < 6; w++) OCC.push(ev("piano", "Piano lesson", at(6 + 7 * w - 7, 17), 60, { color: "#b44cff", rec: { freq: "weekly", interval: 1 } }));
  OCC.push(ev("exam", "Math exam", at(13, 10), 120, { color: "#d70000" }));
  OCC.push(ev("bday", "Ayşe's birthday", at(19, 0), 0, { color: "#ff4f8b", rec: { freq: "yearly", interval: 1 } }));
  OCC.push(ev("flight", "Flight to Berlin", at(22, 6), 180, { color: "#22b8cf" }));

  const which = new URLSearchParams(location.search).get("window") || "main";
  const SETTINGS = { userName: "Enigma", voiceResponses: false, voiceRate: 1, wakeWord: true, hotkey: "Ctrl+Alt+E", hoverMode: false,
    hoverPos: null, autostart: true, defaultReminderTime: "09:00", defaultEventMinutes: 60, weekStartsMonday: true, time24h: true, followUp: true, nihil: false };
  const params = new URLSearchParams(location.search);
  const CUR = today.getFullYear();
  const LIST = [
    { id: "c1", year: CUR, text: "Run a half marathon", done: true, doneAt: null },
    { id: "c2", year: CUR, text: "Visit Japan", done: false, doneAt: null },
    { id: "c3", year: CUR, text: "Read 20 books", done: true, doneAt: null },
    { id: "c4", year: CUR, text: "Learn to cook five proper dishes", done: false, doneAt: null },
    { id: "p1", year: CUR - 1, text: "Get my driving licence", done: true, doneAt: null },
    { id: "p2", year: CUR - 1, text: "Move to a bigger flat", done: false, doneAt: null },
  ];
  // Projects view (?view=projects). Kept in localStorage so the preview remembers edits.
  const uid = () => "x" + Math.random().toString(36).slice(2, 9);
  const tk = (projectId, text, done = false) => ({ id: uid(), projectId, text, done });
  const pj = (id, name, color, tasks) => ({ id, name, color, status: null, tasks: tasks.map(([t, d]) => tk(id, t, d)) });
  const seedBoard = () => ({
    elise: [tk("elise", "Review what moved this week"), tk("elise", "Renew the domain", true), tk("elise", "Back up the calendar")],
    projects: [
      pj("p1", "Lighthouse", "#b44cff", [["Tune the wake word", false], ["Listening indicator", false], ["Yearly checklist", true]]),
      pj("p2", "Atlas", "#22b8cf", [["In-app API key screen", false], ["Build the installer", false], ["Merge the open PR", true], ["Landing page", false]]),
      pj("p3", "Prism", "#ff4f8b", [["Pick the Adaptive shape", false], ["Ear-tuning pass", false]]),
      pj("p4", "Nettle", "#f2a93b", [["Backup and restore", false], ["New exam coefficients", false], ["Corner notes", true]]),
      pj("p5", "Juniper", "#4cd6a0", [["Check the new look on a phone", false], ["Commit the UI work", false]]),
      pj("p6", "Frost", "#5b6cff", [["Recreate the venv", false]]),
      pj("p7", "Archive", "#ff4f6d", [["Write migrations 008-010", false], ["Cache public pages", false], ["View counter", true]]),
      pj("p8", "Meadow", "#c9c6d8", []),
    ],
  });
  let BOARD;
  try { BOARD = JSON.parse(localStorage.getItem("elise-preview-board")) || seedBoard(); } catch { BOARD = seedBoard(); }
  if (params.get("reset")) BOARD = seedBoard();
  const saveBoard = () => { try { localStorage.setItem("elise-preview-board", JSON.stringify(BOARD)); } catch {} };
  const listOf = (id) => (id === "elise" ? BOARD.elise : BOARD.projects.find((p) => p.id === id).tasks);
  const setList = (id, tasks) => { if (id === "elise") BOARD.elise = tasks; else BOARD.projects.find((p) => p.id === id).tasks = tasks; };
  const allLists = () => ["elise", ...BOARD.projects.map((p) => p.id)];
  const findTask = (id) => { for (const l of allLists()) { const t = listOf(l).find((t) => t.id === id); if (t) return [l, t]; } return [null, null]; };
  const PCOLORS = ["#b44cff", "#ff4f6d", "#22b8cf", "#f2a93b", "#4cd6a0", "#5b6cff", "#ff4f8b", "#c9c6d8"];
  window.__calls = [];
  let nextCb = 1;
  window.__TAURI_INTERNALS__ = {
    metadata: { currentWindow: { label: which }, currentWebview: { label: which, windowLabel: which } },
    transformCallback(cb) { const id = nextCb++; window["_" + id] = cb; return id; },
    unregisterCallback() {},
    async invoke(cmd, args) {
      switch (cmd) {
        case "list_occurrences": return OCC.filter((o) => o.start < args.to && o.end > args.from);
        case "ics_export": return "C:/Users/you/Downloads/Elise calendar 2026-11-19.ics";
        case "ics_import": return { added: 48, skipped: 3, approximated: 1, failed: 0 };
        case "get_settings": return { ...SETTINGS };
        case "set_settings": Object.assign(SETTINGS, args.settings); return { ...SETTINGS };
        case "has_api_key": return true;
        case "voice_status": return { available: true, message: "" };
        case "is_calendar_visible": return true;
        case "stage_is_on": return which === "stage";
        case "overlay_get_mode": return params.get("mode") || "expanded";
        case "take_reminders": return which === "overlay" && !params.get("prompt") && !params.get("mode") ? [{ reminderId: "r1", occKey: "x", eventId: "dentist", title: "Dentist",
          start: OCC[2].start, allDay: false, location: "Dr. Kaya's clinic", missed: false }] : [];
        case "run_command":
          await new Promise((r) => setTimeout(r, 900));
          return { kind: "done", message: "Understood.", historyId: "h1",
            summary: ["Added: Dinner with Sarah · Sat 20:00 · reminders: 1h before"] };
        case "voice_speak": return false;
        case "checklist_get":
          if (args.year > CUR) throw "future";
          return { year: args.year, currentYear: CUR, items: LIST.filter((i) => i.year === args.year), canEdit: args.year === CUR, canTick: true };
        case "checklist_years": return [CUR, CUR - 1];
        case "checklist_add": { const it = { id: "n" + Date.now(), year: args.year, text: args.text, done: false, doneAt: null }; LIST.push(it); return it; }
        case "checklist_set_done": LIST.find((i) => i.id === args.id).done = args.done; return null;
        case "checklist_remove": LIST.splice(LIST.findIndex((i) => i.id === args.id), 1); return null;
        case "projects_get": return JSON.parse(JSON.stringify(BOARD));
        case "project_add": { const p = { id: uid(), name: args.name, color: PCOLORS[BOARD.projects.length % PCOLORS.length], status: null, tasks: [] }; BOARD.projects.push(p); saveBoard(); return JSON.parse(JSON.stringify(p)); }
        case "project_update": { const p = BOARD.projects.find((p) => p.id === args.id); p.name = args.name; p.color = args.color; saveBoard(); return null; }
        case "project_set_status": BOARD.projects.find((p) => p.id === args.id).status = args.status; saveBoard(); return null;
        case "project_remove": BOARD.projects = BOARD.projects.filter((p) => p.id !== args.id); saveBoard(); return null;
        case "task_add": { const t = tk(args.projectId, args.text); listOf(args.projectId).push(t); saveBoard(); return { ...t }; }
        case "task_set_done": { const [, t] = findTask(args.id); if (t) t.done = args.done; saveBoard(); return null; }
        case "task_set_text": { const [, t] = findTask(args.id); if (t) t.text = args.text; saveBoard(); return null; }
        case "task_remove": { const [l] = findTask(args.id); if (l) setList(l, listOf(l).filter((t) => t.id !== args.id)); saveBoard(); return null; }
        case "tasks_reorder": { const cur = listOf(args.projectId); setList(args.projectId, args.ids.map((id) => cur.find((t) => t.id === id)).filter(Boolean)); saveBoard(); return null; }
        case "tasks_clear_done": setList(args.projectId, listOf(args.projectId).filter((t) => !t.done)); saveBoard(); return null;
        case "oracle_show": window.__calls.push("oracle_show"); return null;
        case "take_year_prompt": return params.get("prompt") ? { year: CUR, missed: false } : null;
        case "plugin:event|listen": return nextCb++;
        default: return null;
      }
    },
  };
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
